<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef">
<title>回診日程表</title>
<style>
  :root{
    --paper:#f6f4ef;
    --ink:#1c2430;
    --ink-soft:#68727f;
    --rule:#ddd8cd;
    --pen-blue:#26418f;
    --pen-red:#a8342c;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
    max-width:560px;
    margin:0 auto;
    font-variant-numeric:tabular-nums;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:.02em}
  .sub{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .controls{
    margin:20px 0 26px;
    padding:14px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:10px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 12px;
  }
  label{font-size:13px;color:var(--ink-soft)}
  input[type=date]{
    font:inherit;font-size:15px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:7px;
    padding:7px 9px;
    flex:1 1 150px;
    min-width:0;
  }
  button{
    font:inherit;font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:7px;
    padding:7px 13px;
    cursor:pointer;
  }
  button:active{background:var(--rule)}
  .row{
    display:grid;
    grid-template-columns:52px 1fr;
    gap:14px;
    padding:16px 0;
    border-top:1px solid var(--rule);
    align-items:baseline;
  }
  .row:last-child{border-bottom:1px solid var(--rule)}
  .row.next .count{color:var(--pen-blue);font-weight:600}
  .count{font-size:14px;color:var(--ink-soft);white-space:nowrap}
  .visit{font-size:27px;font-weight:600;color:var(--pen-blue);letter-spacing:-.01em}
  .weekday{font-size:14px;font-weight:400;color:var(--ink-soft);margin-left:7px}
  .window{font-size:15px;color:var(--pen-red);margin-top:5px}
  .window .tag{font-size:12px;color:var(--ink-soft);margin-right:6px}
  .away{font-size:12px;color:var(--ink-soft);margin-top:4px}
  footer{margin-top:22px;font-size:12px;color:var(--ink-soft);line-height:1.7}
  :focus-visible{outline:2px solid var(--pen-blue);outline-offset:2px}
  @media (prefers-color-scheme:dark){
    :root{--paper:#161a1f;--ink:#e9e6df;--ink-soft:#98a0aa;--rule:#333a43;--card:#1d222a;--pen-blue:#8fb0ff;--pen-red:#e08b82}
  }
</style>
</head>
<body>
<h1>回診日程表</h1>
<p class="sub">起算日之後的 28 / 56 / 84 / 182 天</p>

<div class="controls">
  <label for="start">起算日</label>
  <input type="date" id="start">
  <button id="today" type="button">今天</button>
</div>

<div id="rows"></div>

<footer id="note"></footer>

<script>
(function(){
  var W = ["日","一","二","三","四","五","六"];
  var OFFSETS = [28,56,84,182];
  var startEl = document.getElementById("start");
  var rowsEl = document.getElementById("rows");
  var noteEl = document.getElementById("note");
  var KEY = "roster-followup-v1";

  function iso(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function add(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
  function md(d){return (d.getMonth()+1)+"/"+d.getDate();}
  function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({start:startEl.value})); }catch(e){}
  }
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY)||"null");
      if(s && s.start){ startEl.value = s.start; return true; }
    }catch(e){}
    return false;
  }

  function render(){
    var v = startEl.value;
    if(!v){ rowsEl.innerHTML=""; noteEl.textContent="選一個起算日。"; return; }
    var p = v.split("-").map(Number);
    var base = new Date(p[0], p[1]-1, p[2]);

    var todayM = midnight(new Date());
    var nextFound = false;
    rowsEl.innerHTML = "";

    OFFSETS.forEach(function(n){
      var visit = add(base,n);
      var delta = (visit.getDay() - 3 + 7) % 7;
      if(delta === 0){ delta = 7; }
      var b = add(visit, -delta);
      var a = add(b, -2);
      var days = Math.round((midnight(visit) - todayM)/86400000);

      var isNext = false;
      if(!nextFound && days >= 0){ isNext = true; nextFound = true; }

      var away;
      if(days === 0) away = "就是今天";
      else if(days > 0) away = "還有 " + days + " 天";
      else away = "已過 " + Math.abs(days) + " 天";

      var div = document.createElement("div");
      div.className = "row" + (isNext ? " next" : "");
      div.innerHTML =
        '<div class="count">' + n + ' 天</div>' +
        '<div>' +
          '<div><span class="visit">' + md(visit) + '</span><span class="weekday">週' + W[visit.getDay()] + ' · 回診</span></div>' +
          '<div class="window"><span class="tag">前置</span>' + md(a) + ' – ' + md(b) + '（週一至週三）</div>' +
          '<div class="away">' + away + '</div>' +
        '</div>';
      rowsEl.appendChild(div);
    });

    noteEl.textContent = "起算日 " + base.getFullYear() + "/" + md(base) + "（週" + W[base.getDay()] + "）。前置區間是回診日前面那組週一到週三，實際安排以診所為準。";
    save();
  }

  if(!load()){ startEl.value = iso(new Date()); }
  document.getElementById("today").addEventListener("click", function(){
    startEl.value = iso(new Date());
    render();
  });
  startEl.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
